name: Desktop viewer prerelease

on:
  workflow_dispatch:
    inputs:
      intel_release_sha256:
        description: SHA-256 of a notarized Intel ZIP attached to the matching draft release
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: desktop-viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    if: inputs.intel_release_sha256 == ''
    name: Desktop / macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Verify native target and desktop units
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sec-hub-desktop-evidence"
          node -e "if(process.platform!=='darwin'||process.arch!==process.argv[1])process.exit(1)" "${{ matrix.arch }}"
          node --test desktop/test/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/sec-hub-desktop-evidence/unit-tests.log"
      - name: Build clean source with verified official runtime
        shell: bash
        run: |
          node desktop/build.mjs --target "darwin-${{ matrix.arch }}" --out "$RUNNER_TEMP/sec-hub-desktop-build" --cache "$RUNNER_TEMP/sec-hub-electron-cache" 2>&1 | tee "$RUNNER_TEMP/sec-hub-desktop-evidence/build.log"
      - name: Run actual packaged application and observe shutdown
        shell: bash
        run: |
          node desktop/smoke.mjs --executable "$RUNNER_TEMP/sec-hub-desktop-build/package/Security Scan Hub.app" --out "$RUNNER_TEMP/sec-hub-desktop-evidence/smoke" 2>&1 | tee "$RUNNER_TEMP/sec-hub-desktop-evidence/smoke.log"
      - name: Preserve native package and raw evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ github.sha }}-darwin-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/sec-hub-desktop-build/*.zip
            ${{ runner.temp }}/sec-hub-desktop-build/*.manifest.json
            ${{ runner.temp }}/sec-hub-desktop-build/SHA256SUMS.txt
            ${{ runner.temp }}/sec-hub-desktop-build/codesign-verification.log
            ${{ runner.temp }}/sec-hub-desktop-build/archive-verification.json
            ${{ runner.temp }}/sec-hub-desktop-build/archive-codesign-verification.log
            ${{ runner.temp }}/sec-hub-desktop-evidence
          if-no-files-found: error
          retention-days: 7

  windows:
    if: inputs.intel_release_sha256 == ''
    name: Saved-results viewer / Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - name: Verify native Windows target
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/sec-hub-desktop-evidence" | Out-Null
          node -e "if(process.platform!=='win32'||process.arch!=='x64')process.exit(1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build clean source with verified official runtime and native helper
        shell: cmd
        run: |
          @echo off
          set "SEC_HUB_VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "delims=" %%I in ('"%SEC_HUB_VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "SEC_HUB_VS=%%I"
          if not defined SEC_HUB_VS exit /b 1
          call "%SEC_HUB_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64 || exit /b 1
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1
          node desktop/build.mjs --target win32-x64 --out "%RUNNER_TEMP%\sec-hub-desktop-build" --cache "%RUNNER_TEMP%\sec-hub-electron-cache" > "%RUNNER_TEMP%\sec-hub-desktop-evidence\build.log" 2>&1
          set "SEC_HUB_BUILD_STATUS=%ERRORLEVEL%"
          type "%RUNNER_TEMP%\sec-hub-desktop-evidence\build.log"
          exit /b %SEC_HUB_BUILD_STATUS%
      - name: Desktop and portable Windows tests with the packaged helper
        shell: pwsh
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/sec-hub-desktop-evidence/portable
        run: |
          $packagedHelper = "$env:RUNNER_TEMP/sec-hub-desktop-build/package/Sec Hub/resources/core/src/native/windows-safe-io.exe"
          $testHelper = "src/native/windows-safe-io.exe"
          if (Test-Path -LiteralPath $testHelper) { throw "Unexpected Windows helper in the source checkout" }
          Copy-Item -LiteralPath $packagedHelper -Destination $testHelper
          try {
            node scripts/ci.mjs windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node --test desktop/test/*.test.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/sec-hub-desktop-evidence/unit-tests.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $testHelper -Force
          }
      - name: Run actual packaged executable and observe shutdown
        shell: pwsh
        run: |
          $profileTemp = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)) 'Temp'
          $env:TEMP = (Resolve-Path -LiteralPath $profileTemp).ProviderPath
          $env:TMP = $env:TEMP
          $smokeEvidence = "$env:RUNNER_TEMP/sec-hub-desktop-evidence/smoke"
          New-Item -ItemType Directory -Path $smokeEvidence | Out-Null
          $smokeOut = [System.IO.Directory]::CreateTempSubdirectory('sec-hub-desktop-smoke-').FullName
          try {
            node desktop/smoke.mjs --executable "$env:RUNNER_TEMP/sec-hub-desktop-build/package/Sec Hub/Sec Hub.exe" --out $smokeOut 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/sec-hub-desktop-evidence/smoke.log"
            $smokeExit = $LASTEXITCODE
          } finally {
            try {
              $files = @('application-stdout.log', 'application-stderr.log', 'smoke-evidence.json', 'smoke-failure.json') |
                ForEach-Object { Join-Path $smokeOut $_ }
              $summaries = Get-ChildItem -LiteralPath $smokeOut -Directory -Filter 'private-smoke-*' -Attributes !ReparsePoint |
                ForEach-Object { Join-Path $_.FullName 'summary.json' }
              foreach ($source in @($files) + @($summaries)) {
                $file = Get-Item -LiteralPath $source -ErrorAction SilentlyContinue
                if ($file -and -not $file.PSIsContainer -and -not ($file.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) {
                  Copy-Item -LiteralPath $file.FullName -Destination $smokeEvidence
                }
              }
            } finally {
              Remove-Item -LiteralPath $smokeOut -Recurse -Force
            }
          }
          exit $smokeExit
      - name: Preserve native package and raw evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ github.sha }}-win32-x64
          path: |
            ${{ runner.temp }}/sec-hub-desktop-build/*.zip
            ${{ runner.temp }}/sec-hub-desktop-build/*.manifest.json
            ${{ runner.temp }}/sec-hub-desktop-build/SHA256SUMS.txt
            ${{ runner.temp }}/sec-hub-desktop-build/archive-verification.json
            ${{ runner.temp }}/sec-hub-desktop-evidence
          if-no-files-found: error
          retention-days: 7

  intel-release-smoke:
    if: github.ref == 'refs/heads/main' && inputs.intel_release_sha256 != ''
    name: Notarized release ZIP / Intel macOS
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: write # GitHub requires push access to download draft release assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false
      - name: Download the exact draft release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ inputs.intel_release_sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          version="$(node -p "require('./desktop/app/package.json').version")"
          tag="desktop-v$version"
          archive="sec-hub-desktop-$version-darwin-x64-notarized-prerelease.zip"
          release_commit="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish --jq 'select(.isDraft) | .targetCommitish')"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$release_commit" "$GITHUB_SHA"
          # Allow desktop CI-only fixes; neither workflow is included in the app payload.
          git diff --quiet "$release_commit" "$GITHUB_SHA" -- . ':(exclude).github/workflows/desktop.yml' ':(exclude).github/workflows/desktop-msix.yml'
          mkdir -p "$RUNNER_TEMP/intel-release"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP/intel-release"
          cd "$RUNNER_TEMP/intel-release"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$archive" | shasum -a 256 -c -
      - name: Extract, verify Gatekeeper and run the Intel app
        shell: bash
        run: |
          node -e "if(process.platform!=='darwin'||process.arch!=='x64')process.exit(1)"
          version="$(node -p "require('./desktop/app/package.json').version")"
          archive="$RUNNER_TEMP/intel-release/sec-hub-desktop-$version-darwin-x64-notarized-prerelease.zip"
          /usr/bin/ditto -x -k "$archive" "$RUNNER_TEMP/intel-release/extracted"
          app="$RUNNER_TEMP/intel-release/extracted/Security Scan Hub.app"
          test "$(/usr/bin/lipo -archs "$app/Contents/MacOS/SecHub")" = x86_64
          /usr/bin/codesign --verify --deep --strict "$app"
          /usr/bin/xcrun stapler validate "$app"
          /usr/sbin/spctl --assess --type execute --verbose=4 "$app" 2>&1 | grep -F 'source=Notarized Developer ID'
          node desktop/smoke.mjs --executable "$app" --out "$RUNNER_TEMP/intel-release-evidence"
      - name: Preserve Intel execution evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-notarized-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/intel-release-evidence/smoke-evidence.json
          if-no-files-found: error
          retention-days: 7
